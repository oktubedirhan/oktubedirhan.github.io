# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.233.0/schema/sveltia-cms.json
# Panelde yapılan her kayıt main dalına commit atar; GitHub Actions siteyi ~1 dakikada yeniler.
# Alanlar src/content.config.ts içindeki şemalarla aynı olmalı.

backend:
  name: github
  repo: oktubedirhan/oktubedirhan.github.io
  branch: main
  # GitHub ile giriş: Vercel'deki bedirhanoktu-cms-auth projesi + "bedirhanoktu.dev CMS" GitHub App
  base_url: https://bedirhanoktu-cms-auth.vercel.app
  auth_methods: [oauth]
  commit_messages:
    create: '{{collection}}: "{{slug}}" eklendi'
    update: '{{collection}}: "{{slug}}" güncellendi'
    delete: '{{collection}}: "{{slug}}" silindi'
    uploadMedia: 'Medya: "{{path}}" yüklendi'
    deleteMedia: 'Medya: "{{path}}" silindi'

site_url: https://www.bedirhanoktu.dev
display_url: https://www.bedirhanoktu.dev

media_folder: public/media
public_folder: /media

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: blog
    label: Blog yazıları
    label_singular: Yazı
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    slug: '{{title}}'
    summary: '{{title}} · {{date}}'
    sortable_fields: [date, title]
    preview_path: /blog/{{slug}}/
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Kısa özet, name: description, widget: string, hint: Listelerde ve arama motorlarında görünür. }
      - { label: Tarih, name: date, widget: datetime, type: date }
      - { label: Etiketler, name: tags, widget: list, required: false, default: [] }
      - { label: Dil, name: lang, widget: select, options: [{ label: Türkçe, value: tr }, { label: English, value: en }], default: tr, hint: 'Türkçe yazılar /blog/, İngilizce yazılar /en/blog/ altında listelenir.' }
      - { label: Taslak, name: draft, widget: boolean, default: false, hint: Açıkken yazı sitede görünmez. }
      - { label: İçerik, name: body, widget: markdown }

  - name: projeler
    label: Projeler
    label_singular: Proje
    folder: src/content/projeler
    extension: json
    format: json
    create: true
    slug: '{{name}}'
    identifier_field: name
    summary: '{{order}}. {{name}}'
    sortable_fields: [order, name]
    fields:
      - { label: Ad, name: name, widget: string }
      - { label: Açıklama, name: description, widget: text }
      - { label: Açıklama (English), name: description_en, widget: text, required: false, hint: 'Boş bırakırsan İngilizce sayfada Türkçesi görünür.' }
      - { label: Sıra, name: order, widget: number, value_type: int, default: 10, hint: Küçük sayı önce gösterilir. }
      - { label: Etiketler, name: tags, widget: list, required: false, default: [] }
      - { label: Teknik not, name: detay, widget: text, required: false, hint: 'Nasıl yapıldığını anlatan tek cümle. Ana sayfada açıklamanın altında görünür.' }
      - { label: Teknik not (English), name: detay_en, widget: text, required: false }
      - label: Katmanlar
        name: katmanlar
        widget: list
        required: false
        hint: 'Sırası 1 olan proje ana sayfada öne çıkar; katmanları varsa üstten alta yığın şeması olarak çizilir. Köprü''nün katmanları Köprü sayfasındaki şemayı da oluşturur.'
        fields:
          - { label: Ad, name: ad, widget: string }
          - { label: Görevi, name: is, widget: string }
          - { label: Görevi (English), name: is_en, widget: string, required: false }
      - label: Algoritma görseli
        name: gorsel
        widget: select
        required: false
        hint: 'Ana sayfada projenin altında küçük bir canlandırma gösterir.'
        options:
          - { label: Fisher–Yates karıştırma, value: karistirma }
          - { label: Leitner kutuları, value: leitner }
      - { label: Site adresi, name: url, widget: string, required: false, hint: 'Sitedeki yolu (/karteikasten/) ya da tam adresi (https://...)' }
      - { label: Kaynak kod, name: repo, widget: string, required: false, hint: 'GitHub reposu (https://github.com/...)' }

  - name: sayfalar
    label: Sayfalar
    files:
      - name: anasayfa
        label: Ana sayfa girişi
        file: src/data/home.json
        format: json
        fields:
          - { label: Üst etiket, name: eyebrow, widget: string }
          - { label: Üst etiket (English), name: eyebrow_en, widget: string, required: false }
          - { label: Ad, name: name, widget: string, hint: 'Ana sayfanın büyük başlığı; iki dilde de aynı.' }
          - { label: Tanıtım paragrafı, name: lead, widget: text }
          - { label: Tanıtım paragrafı (English), name: lead_en, widget: text, required: false }
          - { label: Şu an, name: now, widget: text, required: false, hint: 'Şu an ne üzerinde çalıştığın; boş bırakırsan kutu görünmez.' }
          - { label: Şu an (English), name: now_en, widget: text, required: false }
          - { label: Şu an · güncelleme tarihi, name: nowDate, widget: datetime, type: date, required: false }
      - name: hakkimda
        label: Hakkımda
        file: src/content/sayfalar/hakkimda.md
        format: frontmatter
        preview_path: /hakkimda/
        fields:
          - { label: Başlık, name: title, widget: string }
          - { label: İçerik, name: body, widget: markdown }
      - name: hakkimda_en
        label: Hakkımda (English)
        file: src/content/sayfalar/en/hakkimda.md
        format: frontmatter
        preview_path: /en/about/
        fields:
          - { label: Başlık, name: title, widget: string }
          - { label: İçerik, name: body, widget: markdown }
      - name: kopru
        label: Köprü proje sayfası
        file: src/content/sayfalar/kopru.md
        format: frontmatter
        preview_path: /kopru/
        fields:
          - { label: Başlık, name: title, widget: string }
          - { label: İçerik, name: body, widget: markdown }
      - name: kopru_en
        label: Köprü proje sayfası (English)
        file: src/content/sayfalar/en/kopru.md
        format: frontmatter
        preview_path: /en/kopru/
        fields:
          - { label: Başlık, name: title, widget: string }
          - { label: İçerik, name: body, widget: markdown }
      - name: cv
        label: CV
        file: src/data/cv.json
        format: json
        preview_path: /en/cv/
        fields:
          - { label: Ad, name: name, widget: string }
          - { label: Unvan, name: role, widget: string }
          - { label: Profil, name: profile, widget: text }
          - label: İletişim
            name: contact
            widget: list
            hint: Sayfa herkese açık; telefon ve adres eklemeden önce iki kez düşün.
            fields:
              - { label: Etiket, name: label, widget: string }
              - { label: Değer, name: value, widget: string }
              - { label: Link, name: url, widget: string, required: false }
          - label: Diller
            name: languages
            widget: list
            fields:
              - { label: Dil, name: name, widget: string }
              - { label: Seviye, name: level, widget: string }
          - { label: Teknik, name: technical, widget: list }
          - { label: Güçlü yanlar, name: strengths, widget: list }
          - label: Eğitim
            name: education
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Başlık, name: title, widget: string }
              - { label: Tarih / tür, name: date, widget: string, required: false }
              - { label: Alt satır, name: sub, widget: string, required: false }
              - { label: Açıklama, name: text, widget: text, required: false }
              - { label: Not kutusu, name: note, widget: string, required: false }
              - { label: Teknolojiler, name: stack, widget: string, required: false }
              - { label: Link, name: url, widget: string, required: false }
          - label: Projeler
            name: projects
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Başlık, name: title, widget: string }
              - { label: Tarih / tür, name: date, widget: string, required: false }
              - { label: Alt satır, name: sub, widget: string, required: false }
              - { label: Açıklama, name: text, widget: text, required: false }
              - { label: Not kutusu, name: note, widget: string, required: false }
              - { label: Teknolojiler, name: stack, widget: string, required: false }
              - { label: Link, name: url, widget: string, required: false }
          - label: Okul dışı
            name: extracurricular
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Başlık, name: title, widget: string }
              - { label: Tarih / tür, name: date, widget: string, required: false }
              - { label: Alt satır, name: sub, widget: string, required: false }
              - { label: Açıklama, name: text, widget: text, required: false }
              - { label: Not kutusu, name: note, widget: string, required: false }
              - { label: Teknolojiler, name: stack, widget: string, required: false }
              - { label: Link, name: url, widget: string, required: false }
          - label: Başarılar
            name: achievements
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Başlık, name: title, widget: string }
              - { label: Tarih / tür, name: date, widget: string, required: false }
              - { label: Alt satır, name: sub, widget: string, required: false }
              - { label: Açıklama, name: text, widget: text, required: false }
              - { label: Not kutusu, name: note, widget: string, required: false }
              - { label: Teknolojiler, name: stack, widget: string, required: false }
              - { label: Link, name: url, widget: string, required: false }
